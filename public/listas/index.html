<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- Lista de puerta y evoluciones de la noche para el staff, en vivo desde la base (POST /tickets/lists con clave).
     Tachar a alguien guarda en la base que vino (POST /tickets/attend): lo ven todos los celulares y su medusa
     lo muestra en «Mis hidro-memorias». Con el selector de fecha se marcan de memoria las fechas pasadas.
     Privada: noindex, pero NO va en robots.txt (el preview del link tiene que poder leerla) ni en el sitemap. -->
<meta name="robots" content="noindex" />
<title>Listas · Hidromedusa</title>
<meta name="description" content="Lista de puerta y evoluciones de Hidromedusa para el staff." />
<meta name="theme-color" content="#0a0a0b" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<!-- link preview (Open Graph + Twitter): imagen genérica, sin fecha -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Hidromedusa" />
<meta property="og:title" content="Listas de puerta · Hidromedusa" />
<meta property="og:description" content="Para el staff: poné la clave y mirá las listas en vivo." />
<meta property="og:url" content="https://hidromedusa.com/listas/" />
<meta property="og:image" content="https://hidromedusa.com/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:type" content="image/png" />
<meta property="og:image:alt" content="Hidromedusa — música en vivo, Tandil" />
<meta property="og:locale" content="es_AR" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Listas de puerta · Hidromedusa" />
<meta name="twitter:description" content="Para el staff: poné la clave y mirá las listas en vivo." />
<meta name="twitter:image" content="https://hidromedusa.com/og.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0a0a0b; --bg-2:#141417; --bone:#ECE7DA; --bone-dim:#A8A399;
    --muted:#6f6b63; --line:rgba(236,231,218,0.16); --line-strong:rgba(236,231,218,0.55);
    --acid:#C6FF1A; --hot:#FF2E88; --ink:#0a0a0b;
    --display:'Anton',sans-serif; --body:'Space Grotesk',system-ui,sans-serif; --mono:'Space Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--bone);font-family:var(--body);font-size:15px;}
  .wrap{max-width:760px;margin:0 auto;padding:16px 16px 60px;}
  h1{font-family:var(--display);font-weight:400;font-size:30px;text-transform:uppercase;margin:4px 0 2px;letter-spacing:.01em;}
  .meta{font-family:var(--mono);font-size:11px;color:var(--bone-dim);}
  .gate{margin-top:40px;display:flex;flex-direction:column;gap:10px;max-width:320px;}
  input{font:inherit;background:var(--bg-2);color:var(--bone);border:1px solid var(--line-strong);padding:11px 12px;border-radius:0;width:100%;}
  input:focus{outline:2px solid var(--acid);outline-offset:-1px;}
  button{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.04em;background:var(--acid);color:var(--ink);border:0;padding:11px 14px;cursor:pointer;font-weight:700;}
  button.ghost{background:none;color:var(--bone);border:1px solid var(--line-strong);}
  .err{color:var(--hot);font-family:var(--mono);font-size:12px;min-height:1em;}
  .tabs{display:flex;gap:0;margin:14px 0 10px;position:sticky;top:0;background:var(--bg);z-index:2;padding-top:6px;}
  .tabs button{flex:1;background:none;color:var(--bone-dim);border:1px solid var(--line);font-size:13px;}
  .tabs button.on{background:var(--acid);color:var(--ink);border-color:var(--acid);}
  .bar{display:flex;gap:8px;align-items:center;position:sticky;top:52px;background:var(--bg);z-index:2;padding:4px 0 8px;}
  .bar input{flex:1;}
  .tot{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px;}
  .tot div{border:1px solid var(--line-strong);padding:6px 9px;font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--bone-dim);}
  .tot b{display:block;font-family:var(--display);font-weight:400;font-size:22px;color:var(--bone);line-height:1.1;}
  .how{border-left:3px solid var(--acid);background:var(--bg-2);padding:8px 10px;font-size:13px;line-height:1.5;margin-bottom:10px;}
  h2{font-family:var(--display);font-weight:400;font-size:19px;text-transform:uppercase;margin:18px 0 4px;letter-spacing:.02em;}
  h2 small{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:none;letter-spacing:0;}
  .row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);}
  .row.done .p,.row.done .nm{text-decoration:line-through;color:var(--muted);}
  .cks{display:flex;gap:4px;flex:none;}
  .cks input{appearance:none;-webkit-appearance:none;width:24px;height:24px;padding:0;border:1.5px solid var(--bone);background:none;cursor:pointer;}
  .cks input:checked{background:var(--acid);border-color:var(--acid);}
  .p{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.02em;}
  .nm{color:var(--bone-dim);font-size:14px;margin-left:auto;text-align:right;}
  .x2{font-family:var(--mono);font-size:10px;font-weight:700;background:var(--bone);color:var(--ink);padding:1px 5px;margin-left:5px;}
  .warn{border:1px dashed var(--line-strong);padding:8px 10px;margin-top:14px;font-size:13px;line-height:1.5;}
  .warn button{margin-top:8px;display:block;}
  .ev{display:flex;gap:8px;align-items:center;margin-top:10px;}
  .ev select{flex:1;font:inherit;font-size:14px;background:var(--bg-2);color:var(--bone);border:1px solid var(--line-strong);padding:9px 10px;border-radius:0;}
  .qr{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--acid);border:1px solid var(--acid);padding:1px 5px;margin-left:5px;}
  .sync{font-family:var(--mono);font-size:11px;color:var(--hot);min-height:0;margin:4px 0;}
  .hide{display:none!important;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Listas · Hidromedusa</h1>
  <div class="meta" id="meta">Puerta y evoluciones, en vivo</div>

  <form class="gate" id="gate">
    <input id="clave" type="password" placeholder="Clave" autocomplete="current-password" required />
    <button type="submit">Ver listas</button>
    <div class="err" id="err"></div>
  </form>

  <div id="app" class="hide">
    <div class="ev"><select id="ev" aria-label="Fecha" onchange="pickEv(this.value)"></select></div>
    <div class="tabs"><button id="t-door" class="on" onclick="tab('door')">Puerta</button><button id="t-evo" onclick="tab('evo')">Evoluciones</button></div>
    <div class="bar"><input id="q" type="search" placeholder="Buscar palabra o nombre…" oninput="filter()" /><button class="ghost" onclick="load()">↻</button></div>
    <div class="sync" id="sync" aria-live="polite"></div>
    <div id="door"></div>
    <div id="evo" class="hide"></div>
  </div>
</div>
<script>
const API_BASE='https://p2vsvdihylfl6w4c6pfnnuwd4u0dwcvw.lambda-url.sa-east-1.on.aws';
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold=(s)=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const pal=(c)=>c.replace(/-/g,' ').toUpperCase();
const personas=(n)=>{const m=/\bx\s*(\d+)\s*$/i.exec(n||'');return m?+m[1]:1;};
const clean=(n)=>String(n||'').replace(/\s*\bx\s*\d+\s*$/i,'');
const x2=(n)=>personas(n)>1?`<span class="x2">x${personas(n)}</span>`:'';

// Casillas: una por persona de la entrada. Tachar guarda en la base cuántos de esa entrada pasaron
// (POST /tickets/attend → la marca de que vino, que ven todos los celulares y la medusa). Si no hay
// señal, quedan en este celular (hm-listas-pend) y se mandan solas al volver.
const PK='hm-listas-pend';
let pend={};
try{pend=JSON.parse(localStorage.getItem(PK)||'{}');}catch(e){}
const savePend=()=>{try{localStorage.setItem(PK,JSON.stringify(pend));}catch(e){}};
// Las casillas de antes (solo en este celular, sin base): se ofrecen para subir a la fecha que se ve.
const TK='hm-listas-ticks';
let ticks={};
try{ticks=JSON.parse(localStorage.getItem(TK)||'{}');}catch(e){}
let DATA=null, EVENTO='';
try{EVENTO=sessionStorage.getItem('hm-listas-ev')||'';}catch(e){}   // solo esta pestaña: la próxima vez abre en la fecha que viene
const pkey=(id)=>EVENTO+'|'+id;
function cks(t,n){
  const p=pend[pkey(t.id)], on=p?p.n:(t.n||0);
  let h='';
  for(let i=0;i<n;i++)h+=`<input type="checkbox" aria-label="Vino" ${i<on?'checked':''} onchange="tickChange(this)">`;
  return `<span class="cks" data-id="${esc(t.id)}">${h}</span>`;
}
function tickChange(el){
  const box=el.closest('.cks'), id=box.dataset.id;
  const n=[...box.querySelectorAll('input')].filter((b)=>b.checked).length;
  pend[pkey(id)]={evento:EVENTO,id,n}; savePend(); paintDone(); flush();
}
let flushing=false;
async function flush(){
  if(flushing||!CLAVE)return;
  flushing=true;
  try{
    for(const k of Object.keys(pend)){
      const p=pend[k];
      let res;
      try{res=await fetch(API_BASE+'/tickets/attend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clave:CLAVE,evento:p.evento,id:p.id,n:p.n})});}
      catch(e){break;}   // sin señal: queda para después
      if(res.status===401){gateOut();break;}
      if(res.status>=500)break;
      const d=await res.json().catch(()=>({}));
      if(pend[k]&&pend[k].n===p.n)delete pend[k];   // si la tocaron de nuevo mientras iba, sigue pendiente
      savePend();
      if(res.ok&&DATA&&p.evento===EVENTO){for(const t of [...DATA.paid,...DATA.guests])if(t.id===p.id){t.n=d.n;t.vino=d.vino;}}
      if(!res.ok)$('sync').textContent='No se pudo marcar: '+(d.error||res.status);
    }
  }finally{flushing=false;showSync();}
}
function showSync(){
  const n=Object.keys(pend).length;
  if(n)$('sync').textContent=`${n} marca${n>1?'s':''} sin guardar (sin señal): se mandan solas al volver`;
  else if(/sin guardar/.test($('sync').textContent))$('sync').textContent='';
}
window.addEventListener('online',flush);
function paintDone(){
  document.querySelectorAll('[data-row]').forEach((r)=>{
    const boxes=[...r.querySelectorAll('input[type=checkbox]')];
    r.classList.toggle('done',boxes.length>0&&boxes.every((b)=>b.checked));
  });
}
// Casillas viejas de esta fecha (de cuando quedaban solo en el celular) que la base todavía no tiene
function oldTicks(){
  if(!DATA)return [];
  const out=[];
  const look=(t,prefix,n)=>{let k=0;for(let i=0;i<n;i++)if(ticks[prefix+':'+i])k++;if(k>(t.n||0)&&!pend[pkey(t.id)])out.push({t,n:k,prefix});};
  DATA.paid.forEach((t)=>look(t,'d:'+t.claim,personas(t.buyerName)));
  DATA.guests.forEach((t)=>look(t,'g:'+fold(t.buyerName),1));
  return out;
}
function uploadOld(){
  for(const {t,n,prefix} of oldTicks()){
    pend[pkey(t.id)]={evento:EVENTO,id:t.id,n};
    for(const k of Object.keys(ticks))if(k.startsWith(prefix+':'))delete ticks[k];   // ya no hacen falta acá
  }
  savePend(); try{localStorage.setItem(TK,JSON.stringify(ticks));}catch(e){}
  render(DATA); flush();
}
function pickEv(v){EVENTO=v;try{sessionStorage.setItem('hm-listas-ev',v);}catch(e){}load();}
function gateOut(){try{localStorage.removeItem('hm-listas-clave');}catch(e){} $('gate').classList.remove('hide');$('app').classList.add('hide');$('err').textContent='Clave incorrecta';}

let CLAVE='';
try{CLAVE=localStorage.getItem('hm-listas-clave')||'';}catch(e){}
$('gate').onsubmit=(ev)=>{ev.preventDefault();CLAVE=$('clave').value.trim();load(true);};

async function load(fromGate){
  if(!CLAVE)return;
  $('err').textContent='';
  try{
    const res=await fetch(API_BASE+'/tickets/lists',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clave:CLAVE,evento:EVENTO||undefined})});
    const data=await res.json().catch(()=>({}));
    if(res.status===401){gateOut();return;}
    if(!res.ok)throw new Error(data.error||('Error '+res.status));
    try{localStorage.setItem('hm-listas-clave',CLAVE);}catch(e){}
    $('gate').classList.add('hide');$('app').classList.remove('hide');
    render(data);
    flush();
  }catch(e){
    if(fromGate||$('app').classList.contains('hide'))$('err').textContent='No se pudo cargar: '+e.message;
    else $('meta').textContent='Sin conexión — mostrando la última versión';
  }
}

function render(d){
  DATA=d;
  if(d.event)EVENTO=d.event.id;
  const sel=$('ev');
  sel.innerHTML=(d.eventos||[]).map((e)=>{const [y,m,dd]=e.date.split('-');return `<option value="${esc(e.id)}" ${e.id===EVENTO?'selected':''}>${+dd}/${+m}/${y} · ${esc(e.name.replace(/^Hidromedusa · /,''))}${e.id===d.current?' (la que viene)':''}</option>`;}).join('');
  sel.parentNode.classList.toggle('hide',(d.eventos||[]).length<2);
  const past=!!(d.event&&d.event.end&&Date.now()>Date.parse(d.event.end));
  const at=new Date(d.at).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hourCycle:'h23',timeZone:'America/Argentina/Buenos_Aires'});
  $('meta').textContent=`${d.event?d.event.name+' · ':''}actualizado ${at}`;
  const paid=[...d.paid].sort((a,b)=>a.claim.localeCompare(b.claim));
  const guests=[...d.guests].sort((a,b)=>fold(a.buyerName).localeCompare(fold(b.buyerName)));
  const nPaid=paid.reduce((s,t)=>s+personas(t.buyerName),0);
  const anul=d.cancelled.map((t)=>`<b>${esc(pal(t.claim))}</b>`).join(', ');
  const nVino=[...paid,...guests].reduce((s,t)=>{const p=pend[pkey(t.id)],n=p?p.n:(t.n||0);return s+(n||(t.vino==='qr'?1:0));},0);
  const qr=(t)=>t.vino==='qr'?'<span class="qr" title="Marcó que vino con el QR de la noche">QR ✓</span>':'';
  const viejas=oldTicks();

  // ── Puerta ──
  let h=`<div class="tot"><div><b>${nPaid+guests.length}</b>personas</div><div><b>${nPaid}</b>con entrada (${paid.length})</div><div><b>${guests.length}</b>invitados</div><div><b>${nVino}</b>vinieron</div></div>
  <div class="how">${past
    ? `<b>Fecha pasada:</b> tachá a los que vinieron (una casilla por persona). Queda guardado en la base y su medusa muestra la marca <b>✓</b> en «Mis hidro-memorias».`
    : `Te dicen su <b>palabra clave</b> → buscala, tachá una casilla por persona y dales la entrada-sticker. <span class="x2">x2</span> = entran 2. <b>Invitados</b> van por nombre. Si no se acuerdan la palabra, buscá el nombre. Lo que tachás <b>queda guardado para todos los celulares</b> y es la marca de que vino.`}</div>`;
  if(viejas.length)h+=`<div class="warn">Este celular tiene <b>${viejas.length}</b> ${viejas.length>1?'entradas tachadas':'entrada tachada'} de esta fecha que todavía no ${viejas.length>1?'están':'está'} en la base (de cuando las casillas quedaban solo acá).<button onclick="uploadOld()">${viejas.length>1?'Subirlas':'Subirla'} a la base</button></div>`;
  h+=`<h2>Con entrada <small>· por palabra</small></h2>`;
  h+=paid.map((t)=>`<div class="row" data-row data-q="${esc(fold(t.claim+' '+t.buyerName))}">${cks(t,personas(t.buyerName))}<span class="p">${esc(pal(t.claim))}${qr(t)}</span><span class="nm">${esc(clean(t.buyerName))}${x2(t.buyerName)}</span></div>`).join('');
  h+=`<h2>Invitados <small>· sin palabra</small></h2>`;
  h+=guests.map((t)=>`<div class="row" data-row data-q="${esc(fold(t.buyerName))}">${cks(t,1)}<span class="nm" style="margin-left:0;text-align:left;color:var(--bone)">${esc(t.buyerName)}</span></div>`).join('');
  if(anul)h+=`<div class="warn">⚠️ Anulada (no entra): ${anul}</div>`;
  if(d.invitesUnused&&!past)h+=`<div class="warn">${d.invitesUnused} invitaciones sin usar: si alguien se anota, aparece acá al actualizar (↻).</div>`;
  $('door').innerHTML=h;

  // ── Evoluciones: medusas que subieron de nivel esta noche con el QR (sin nombres), la última arriba ──
  const evo=[...(d.evolved||[])].reverse();
  const porNivel={};for(const t of evo)porNivel[t.level]=(porNivel[t.level]||0)+1;
  let e=`<div class="tot"><div><b>${evo.length}</b>evolucionaron</div>${Object.keys(porNivel).sort().map((n)=>`<div><b>${porNivel[n]}</b>a nivel ${n}</div>`).join('')}</div>
  <div class="how">Las medusas que subieron de nivel ${past?'esa':'esta'} noche con el <b>QR de la noche</b>, la última arriba. Si a alguien no le anda, que escanee el QR de nuevo y cargue sus dos palabras. La que nació esta noche evoluciona recién en la próxima fecha.</div>`;
  e+=evo.map((t)=>`<div class="row" data-q="${esc(fold(t.claim))}"><span class="p">${esc(pal(t.claim))}</span><span class="nm">nivel ${esc(t.level)} · ${esc(t.rasgo==='trebol'?'trébol':t.rasgo)}</span></div>`).join('');
  if(!evo.length)e+=`<div class="warn">Todavía ninguna. Se actualiza sola cada minuto (o tocá ↻).</div>`;
  $('evo').innerHTML=e;
  paintDone();filter();showSync();
}

function filter(){
  const q=fold($('q').value.trim());
  document.querySelectorAll('[data-q]').forEach((el)=>el.classList.toggle('hide',!!q&&!el.dataset.q.includes(q)));
}
function tab(t){
  $('door').classList.toggle('hide',t!=='door');$('evo').classList.toggle('hide',t!=='evo');
  $('t-door').classList.toggle('on',t==='door');$('t-evo').classList.toggle('on',t==='evo');
  $('q').placeholder=t==='door'?'Buscar palabra o nombre…':'Buscar palabra…';
}

if(CLAVE)load();
setInterval(()=>{if(!document.hidden)load();},60000);
showSync();
</script>
</body>
</html>
